<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Login</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="background"></div>

    <div class="main-container">
        <div class="device-section">
            <div class="floating-elements">
                <div class="floating-element"></div>
                <div class="floating-element"></div>
                <div class="floating-element"></div>
            </div>

            <div class="device-icons-container">
                <div class="device-item">
                    <div class="device-icon">💡</div>
                </div>
                <div class="device-item">
                    <div class="device-icon fan-icon">
                        <div class="fan-blades">
                            <div class="blade blade1"></div>
                            <div class="blade blade2"></div>
                            <div class="blade blade3"></div>
                            <div class="fan-center"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="login-section">
            <div class="login-header">
                <h1 class="login-title">Log in</h1>
                <p class="login-subtitle">Welcome back</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <input 
                        type="email" 
                        class="form-input" 
                        id="email" 
                        placeholder="Email" 
                        required
                    >
                    <div class="input-icon">👤</div>
                </div>

                <div class="form-group">
                    <input 
                        type="password" 
                        class="form-input" 
                        id="password" 
                        placeholder="Password" 
                        required
                    >
                    <div class="input-icon">🔒</div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <div class="loading-spinner" id="loadingSpinner"></div>
                    <span id="loginBtnText">Log in</span>
                </button>
            </form>

            <div class="signup-link">
                Don't have an account?
                <a href="signup.html" class="signup-btn" onclick="goToSignup()">Sign up</a>
            </div>
        </div>
    </div>

    <script src="../css/login.css"></script>
</body>
</html>
