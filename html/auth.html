<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Auth</title>
    <!-- You can include both CSS files or combine them later -->
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="background"></div>

    <!-- Back Button -->
    <button class="back-btn" onclick="window.location.href='index.html'">
        ← Back
    </button>

    <div class="main-container">
        <!-- Device Section (shared for both) -->
        <div class="device-section">
            <div class="floating-elements">
                <div class="floating-element"></div>
                <div class="floating-element"></div>
                <div class="floating-element"></div>
            </div>
            <div class="device-icons-container">
                <div class="device-item">
                    <div class="device-icon">💡</div>
                </div>
                <div class="device-item">
                    <div class="device-icon fan-icon">
                        <div class="fan-blades">
                            <div class="blade blade1"></div>
                            <div class="blade blade2"></div>
                            <div class="blade blade3"></div>
                            <div class="fan-center"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Login Section -->
        <div class="login-section" id="login-section">
            <div class="login-header">
                <h1 class="login-title">Log in</h1>
                <p class="login-subtitle">Welcome back</p>
            </div>
            <div class="error-message" id="loginError"></div>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <input 
                        type="email" 
                        class="form-input" 
                        id="loginEmail" 
                        placeholder="Email" 
                        required
                    >
                    <div class="input-icon">👤</div>
                </div>
                <div class="form-group">
                    <input 
                        type="password" 
                        class="form-input" 
                        id="loginPassword" 
                        placeholder="Password" 
                        required
                    >
                    <div class="input-icon">🔒</div>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <div class="loading-spinner" id="loginLoadingSpinner"></div>
                    <span id="loginBtnText">Log in</span>
                </button>
            </form>
            <div class="signup-link">
                Don't have an account?
                <a href="#" class="signup-btn" id="showSignupBtn">Sign up</a>
            </div>
        </div>

        <!-- Signup Section (hidden by default) -->
        <div class="signup-section" id="signup-section" style="display: none;">
            <div class="signup-header">
                <h1 class="signup-title">Sign up</h1>
                <p class="signup-subtitle">Welcome</p>
            </div>
            <div class="error-message" id="signupError"></div>
            <form class="signup-form" id="signupForm">
                <div class="form-group">
                    <input 
                        type="text" 
                        class="form-input" 
                        id="signupName" 
                        placeholder="Name" 
                        required
                    >
                    <div class="input-icon">👤</div>
                </div>
                <div class="form-group">
                    <input 
                        type="email" 
                        class="form-input" 
                        id="signupEmail" 
                        placeholder="Email" 
                        required
                    >
                    <div class="input-icon">📧</div>
                </div>
                <div class="form-group password-group">
                    <input 
                        type="password" 
                        class="form-input" 
                        id="signupPassword" 
                        placeholder="Password" 
                        required
                    >
                    <div class="input-icon">🔒</div>
                    <div class="password-toggle" id="passwordToggle" style="display: none;">
                        <span class="toggle-icon">👁️</span>
                    </div>
                </div>
                <button type="submit" class="signup-btn" id="signupBtn">
                    <div class="loading-spinner" id="signupLoadingSpinner"></div>
                    <span id="signupBtnText">Sign up</span>
                </button>
            </form>
            <div class="login-link">
                Already have an account?
                <a href="#" class="login-btn-link" id="showLoginBtn">Log in</a>
            </div>
        </div>
    </div>

    <!-- Only 1 JS file to control everything -->
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
