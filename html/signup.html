<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartControl - Sign Up</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
    <div class="background"></div>

    <div class="main-container">
        <div class="device-section">
            <div class="floating-elements">
                <div class="floating-element"></div>
                <div class="floating-element"></div>
                <div class="floating-element"></div>
            </div>

            <div class="device-icons-container">
                <div class="device-item">
                    <div class="device-icon">💡</div>
                </div>
                <div class="device-item">
                    <div class="device-icon fan-icon">
                        <div class="fan-blades">
                            <div class="blade blade1"></div>
                            <div class="blade blade2"></div>
                            <div class="blade blade3"></div>
                            <div class="fan-center"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="signup-section">
            <div class="signup-header">
                <h1 class="signup-title">Sign up</h1>
                <p class="signup-subtitle">Welcome</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form class="signup-form" id="signupForm">
                <div class="form-group">
                    <input 
                        type="text" 
                        class="form-input" 
                        id="name" 
                        placeholder="Name" 
                        required
                    >
                    <div class="input-icon">👤</div>
                </div>

                <div class="form-group">
                    <input 
                        type="email" 
                        class="form-input" 
                        id="email" 
                        placeholder="Email" 
                        required
                    >
                    <div class="input-icon">📧</div>
                </div>

                <div class="form-group password-group">
                    <input 
                        type="password" 
                        class="form-input" 
                        id="password" 
                        placeholder="Password" 
                        required
                    >
                    <div class="input-icon">🔒</div>
                    <div class="password-toggle" id="passwordToggle" style="display: none;">
                        <span class="toggle-icon">👁️</span>
                    </div>
                </div>

                <button type="submit" class="signup-btn" id="signupBtn">
                    <div class="loading-spinner" id="loadingSpinner"></div>
                    <span id="signupBtnText">Sign up</span>
                </button>
            </form>

            <div class="login-link">
                Already have an account?
                <a href="#" class="login-btn-link" onclick="goToLogin()">Log in</a>
            </div>
        </div>
    </div>

    <script src="../js/signup.js"></script>
</body>
</html>
