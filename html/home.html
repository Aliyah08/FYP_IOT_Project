<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartControl - IoT Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Modern fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,600,700&display=swap">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/home.css">
</head>
<body>
  <div class="background"></div>
  <div class="dashboard-shell">
    <header class="dashboard-header">
      <div class="dashboard-logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">SmartControl</span>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Logout">
        <span class="logout-icon">⎋</span>
        <span class="logout-text">Logout</span>
      </button>
    </header>

    <main>
      <section class="welcome-card" id="welcomeSection">
        <div class="user-avatar">
          <span class="user-icon">👤</span>
        </div>
        <div>
          <h1 class="dashboard-title" id="welcomeTitle">Welcome, User!</h1>
          <p class="dashboard-email" id="welcomeEmail"></p>
        </div>
      </section>

      <section class="device-grid">
        <!-- Light Card -->
        <div class="device-card light-card">
          <div class="device-card-header">
            <div class="device-icon device-light" id="lightIcon">💡</div>
            <div class="device-label">Smart Light</div>
          </div>
          <div class="device-status-row">
            <span class="status-dot" id="lightStatusDot"></span>
            <span class="device-card-status" id="lightStatus">Status: <span>OFF</span></span>
          </div>
          <button class="device-toggle-btn" id="toggleLight">
            <span class="toggle-icon">🔄</span> Toggle
          </button>
        </div>
        <!-- Fan Card -->
        <div class="device-card fan-card">
          <div class="device-card-header">
            <div class="device-icon device-fan" id="fanIcon">
              <span class="fan-emoji">🌀</span>
            </div>
            <div class="device-label">Smart Fan</div>
          </div>
          <div class="device-status-row">
            <span class="status-dot" id="fanStatusDot"></span>
            <span class="device-card-status" id="fanStatus">Status: <span>OFF</span></span>
          </div>
          <button class="device-toggle-btn" id="toggleFan">
            <span class="toggle-icon">🔄</span> Toggle
          </button>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="../js/home.js"></script>
</body>
</html>
